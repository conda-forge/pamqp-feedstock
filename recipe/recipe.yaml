schema_version: 1

context:
  name: pamqp
  version: "5.0.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: d76dd4af900802483cda5f318a5328c86a1e9b127159f5455b17d9a0bb658b89

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pamqp
        - pamqp.frame
        - pamqp.body
        - pamqp.frame
        - pamqp.decode
        - pamqp.encode
        - pamqp.exceptions
        - pamqp.heartbeat
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: pamqp is a pure-python AMQP 0-9-1 frame encoder and decoder
  description: |
    pamqp is a pure-python AMQP 0-9-1 frame encoder and decoder. The aim is to create a client agnostic python encoder and decoder for general purpose use.
  homepage: https://github.com/gmr/pamqp
  repository: https://github.com/gmr/pamqp
  documentation: https://pamqp.readthedocs.io/

extra:
  recipe-maintainers:
    - akrherz
    - gregfreeman
